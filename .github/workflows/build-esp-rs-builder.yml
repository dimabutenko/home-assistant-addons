name: Build & Push ESP-RS Builder add-on

on:
  push:
    paths:
      - esp_rs_builder/**/*
      - .github/workflows/build-esp-rs-builder.yml
    branches:
      - "main"
concurrency:
  group: esp-rs-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version from config
        id: version
        run: echo "VERSION=$(grep -m1 '^version:' esp_rs_builder/config.yaml | awk '{print $2}' | tr -d '\"')" >> $GITHUB_OUTPUT
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./esp_rs_builder
          file: ./esp_rs_builder/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64
          tags: |
            ghcr.io/dimabutenko/ha-addon-esp-rs-builder:latest
            ghcr.io/dimabutenko/ha-addon-esp-rs-builder:${{ steps.version.outputs.VERSION }}
