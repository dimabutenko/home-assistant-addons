name: Build & Push Twinkly Garland add-on

on:
  push:
    paths:
      - twinkly_garland/**/*
      - .github/workflows/build-twinkly.yml
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version from config
        id: version
        run: echo "VERSION=$(grep -m1 '^version:' twinkly_garland/config.yaml | awk '{print $2}' | tr -d '\"')" >> $GITHUB_OUTPUT
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./twinkly_garland
          file: ./twinkly_garland/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/dimabutenko/ha-addon-twinkly:latest
            ghcr.io/dimabutenko/ha-addon-twinkly:${{ steps.version.outputs.VERSION }}
