# .github/workflows/build.yml

name: Build & Push Add-on (Single Arch)

on:
  push:
    paths:
      - calibre_web_automated/**/*
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      - name: Get version from config
        id: version
        run: echo "VERSION=$(yq e '.version' 'calibre_web_automated/config.yaml')" >> $GITHUB_OUTPUT
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./calibre_web_automated
          file: ./calibre_web_automated/Dockerfile
          push: true
          platforms: linux/aarch64
          tags: |
            ghcr.io/dimabutenko/ha-addon-cwa:latest
            ghcr.io/dimabutenko/ha-addon-cwa:${{ steps.version.outputs.VERSION }}