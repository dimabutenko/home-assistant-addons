[package]
name = "builder-engine"
description = "YAML parsing, schema/pin validation, codegen and build driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "builder-engine"
path = "src/main.rs"

[dependencies]
jsonschema = { version = "0.63.2", default-features = false }
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
syn = { version = "3.0.10", features = ["full"] }
thiserror = "2.0.21"
