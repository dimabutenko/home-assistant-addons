# Default target is the ESP32-C6 one (board schema `target`). For ESP32-S3 pass
# `--target xtensa-esp32s3-none-elf --features esp32s3` with the `espup` toolchain.
[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]
