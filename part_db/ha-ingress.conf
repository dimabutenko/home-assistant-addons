# Home Assistant ingress serves the app under /api/hassio_ingress/<token>/ and sends that prefix
# in X-Ingress-Path. Part-DB (Symfony) expects it in X-Forwarded-Prefix.
# Requests that do not come through ingress (direct port, MCP clients) get no prefix.
RequestHeader unset X-Forwarded-Prefix
SetEnvIf X-Ingress-Path "^(.+)$" INGRESS_PATH=$1
RequestHeader set X-Forwarded-Prefix "%{INGRESS_PATH}e" env=INGRESS_PATH
