name: Twinkly Garland
url: "https://github.com/dimabutenko/home-assistant-addons"
version: 0.17.3
slug: twinkly_garland
description: "Local control of Twinkly Gen2 garlands: effects stored on the devices, ensure/reconcile, layout preview"
arch: ["aarch64"]
startup: application
boot: auto
init: false
image: "ghcr.io/dimabutenko/ha-addon-twinkly"
ingress: true
ingress_port: 8099
panel_icon: mdi:string-lights
panel_title: Garland
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  devices: []
  auto_ensure: false
  ensure_interval_min: 60
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  scan_lights: []
schema:
  devices:
    - name: str
      host: str
  auto_ensure: bool
  ensure_interval_min: int(5,1440)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  scan_lights:
    - str
